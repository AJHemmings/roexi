[package]
name = "roexi"
version = "0.1.0"
description = "roexi"
authors = ["Adam Hemmings"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "roexi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-log = "2"

[profile.release]
opt-level = 1
codegen-units = 16
lto = false
debug = false
strip = "symbols"
